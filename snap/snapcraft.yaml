name: crunchyroll-ubuntu-desktop
title: Crunchyroll Desktop (Unofficial)
adopt-info: crunchyroll-app
license: ISC
website: https://github.com/pulkitmundra/crunchyroll-ubuntu-desktop
source-code: https://github.com/pulkitmundra/crunchyroll-ubuntu-desktop
issues: https://github.com/pulkitmundra/crunchyroll-ubuntu-desktop/issues
contact: https://github.com/pulkitmundra/crunchyroll-ubuntu-desktop/issues
summary: Unofficial Linux desktop client for Crunchyroll with Widevine, PiP & MPRIS
description: |
  Crunchyroll Desktop (Unofficial) is an open-source Linux desktop client for
  streaming Crunchyroll with native desktop integration and a custom dark UI.

  Key Features:
  * Built-in Widevine DRM playback support via Castlabs Electron runtime
  * Glassmorphic dark UI with floating sidebar dock and smooth mouse/trackpad navigation
  * Smart Auto-PiP (Picture-in-Picture) mini-player when switching workspaces or windows
  * In-player Episodes Drawer with instant `<` / `>` season switcher and watched indicators
  * Native Linux desktop MPRIS media controls (keyboard play/pause/next/prev & lock-screen artwork)
  * Custom Lists (create, rename, delete) and Watchlist management with toast confirmations
  * Watch History management (remove single episodes or clear history)
  * Subtitle appearance customization (size, color, background opacity, edge style)
  * In-player Video Quality selector (Q), Sleep Timer / Auto-Pause (T) & Timeline Chapter Markers
  * See-through Player Window Translucency (20% - 100%) & Standing Vertical Volume/Translucency Popovers
  * HUD-free 1080p video frame screenshot capture (Ctrl+Shift+S)

  Support the Project:
  * Buy Me a Coffee: https://buymeacoffee.com/pulkitmundra
  * GitHub Sponsors: https://github.com/sponsors/pulkitmundra

  Disclaimer:
  This is an independent, unofficial open-source community project developed by
  Pulkit Mundra and contributors. It is NOT affiliated with, authorized,
  maintained, sponsored, or endorsed by Crunchyroll, LLC or Sony Pictures
  Entertainment. Crunchyroll and its logo are registered trademarks of
  Crunchyroll, LLC. A valid Crunchyroll account is required to stream content.

base: core22
grade: stable
confinement: strict
compression: lzo

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  crunchyroll-ubuntu-desktop:
    command: bin/crunchyroll-desktop
    desktop: snap/gui/crunchyroll-ubuntu-desktop.desktop
    plugs:
      - network
      - audio-playback
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - browser-support
      - home
      - screen-inhibit-control

parts:
  electron-runtime:
    plugin: nil
    build-packages:
      - curl
      - ca-certificates
    stage-packages:
      - libnss3
      - libatk1.0-0
      - libatk-bridge2.0-0
      - libcups2
      - libdrm2
      - libgbm1
      - libgtk-3-0
      - libasound2
      - libpulse0
      - libxss1
      - libxtst6
      - libx11-xcb1
      - libxcomposite1
      - libxdamage1
      - libxfixes3
      - libxrandr2
    override-build: |
      set -eu
      APPIMAGE_URL="https://github.com/pulkitmundra/crunchyroll-ubuntu-desktop/releases/download/v2.1.0/Crunchyroll-Linux-1.1.6.AppImage"
      APPIMAGE_SHA256="ba06670fb21c8e5afa1d4241a4bf911fdbfd9b47bc1ed4d449e6d05645cccdfa"

      curl -fsSL "$APPIMAGE_URL" -o crunchyroll-base.AppImage
      echo "${APPIMAGE_SHA256}  crunchyroll-base.AppImage" | sha256sum -c -
      chmod +x crunchyroll-base.AppImage
      ./crunchyroll-base.AppImage --appimage-extract >/dev/null

      mkdir -p "$CRAFT_PART_INSTALL/opt/crunchyroll"
      cp -a squashfs-root/. "$CRAFT_PART_INSTALL/opt/crunchyroll/"
      rm -rf "$CRAFT_PART_INSTALL/opt/crunchyroll/resources/app.asar"
      rm -rf "$CRAFT_PART_INSTALL/opt/crunchyroll/resources/app"

      if [ -f "squashfs-root/usr/share/icons/hicolor/256x256/apps/crunchyroll-linux.png" ]; then
        mkdir -p "$CRAFT_PART_INSTALL/meta/gui"
        cp "squashfs-root/usr/share/icons/hicolor/256x256/apps/crunchyroll-linux.png" \
           "$CRAFT_PART_INSTALL/meta/gui/icon.png"
      fi

  crunchyroll-app:
    after: [electron-runtime]
    plugin: nil
    source: .
    build-packages:
      - jq
    override-build: |
      set -eu
      VERSION="$(jq -r '.version' "$CRAFT_PART_SRC/package.json")"
      craftctl set version="$VERSION"

      APP_DIR="$CRAFT_PART_INSTALL/opt/crunchyroll/resources/app"
      mkdir -p "$APP_DIR"
      cp -r \
        "$CRAFT_PART_SRC/index.js" \
        "$CRAFT_PART_SRC/preload.js" \
        "$CRAFT_PART_SRC/index.html" \
        "$CRAFT_PART_SRC/package.json" \
        "$CRAFT_PART_SRC/css" \
        "$CRAFT_PART_SRC/js" \
        "$CRAFT_PART_SRC/server" \
        "$APP_DIR/"

      mkdir -p "$CRAFT_PART_INSTALL/bin"
      cat << 'EOF' > "$CRAFT_PART_INSTALL/bin/crunchyroll-desktop"
      #!/bin/sh
      export TMPDIR="${XDG_RUNTIME_DIR:-/tmp}"
      export ELECTRON_FORCE_IS_PACKAGED=true
      export LD_LIBRARY_PATH="$SNAP/opt/crunchyroll/usr/lib:$SNAP/usr/lib/x86_64-linux-gnu:${LD_LIBRARY_PATH:-}"
      exec "$SNAP/opt/crunchyroll/crunchyroll-linux" \
        --no-sandbox \
        --ozone-platform=x11 \
        "$@"
      EOF
      chmod +x "$CRAFT_PART_INSTALL/bin/crunchyroll-desktop"
